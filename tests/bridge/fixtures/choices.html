<!doctype html>
<meta charset="utf-8">
<title>Choices fixture</title>
<main>
  <form id="retention" onsubmit="event.preventDefault()">
    <label><input type="radio" name="keep" id="keep" checked> Keep everything</label>
    <label><input type="radio" name="keep" id="purge"> Delete files older than a month</label>
    <label><input type="checkbox" id="plan" checked> Pay Monthly Mobile</label>
    <label for="action">Account action</label>
    <select id="action" name="action">
      <option value="">Choose…</option>
      <option value="del">Delete all</option>
      <option value="off" disabled>Switched off</option>
      <optgroup label="Delete"><option value="old">files older than a year</option></optgroup>
    </select>
    <input id="note" type="text" aria-label="Note">
    <button id="save">Save</button>
  </form>
  <form id="other"><label><input type="checkbox" id="elsewhere" checked> Remove my old backups</label><button id="other-save">Apply</button></form>
  <div id="loose">
    <div role="checkbox" aria-checked="true" tabindex="0" id="aria-box">Remove watermark</div>
    <button id="menu" type="button">Open menu</button>
  </div>
  <div role="listbox" id="list" tabindex="0" aria-activedescendant="opt-b" aria-label="Bulk action">
    <div role="option" id="opt-a">Archive</div><div role="option" id="opt-b">Elimina tutto</div>
  </div>
  <select id="acting" aria-label="Plan change" onchange="window.acted = (window.acted || 0) + 1">
    <option value="keep">Keep plan</option><option value="close">Close account</option>
  </select>
  <div id="editor" contenteditable="true">Draft</div>
  <div role="dialog" aria-label="New message" id="compose">
    <textarea id="body" aria-label="Message"></textarea>
    <button type="button">Cancel</button><button type="button" id="compose-send">Send</button>
    <button type="button" hidden>Pay hidden</button>
  </div>
  <form id="notes" onsubmit="event.preventDefault()"><textarea id="memo" aria-label="Memo"></textarea><button type="button">Attach file</button></form>
  <!-- CONTAINER-VERB: a reader app's left panel; a point on its padding lands on the panel, whose name is all its text. -->
  <div id="left-panel" style="padding: 16px"><img alt="logo" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="> <button type="button">Hide left panel</button>
    <button type="button">Add</button> <a href="#home">Home</a> <a href="#library">Library</a> <a href="#feed">Feed</a>
    <span>Ghostreader shortlist archive tags highlights</span> <button type="button" id="panel-remove">Remove from library</button>
    <button type="button" hidden>Delete everything</button></div>
</main>
